version: '3.8'

services:
  frontend:
    build: ./react-client
    container_name: team-frontend
    image: team-frontend-image
    ports:
      - "8081:8081"
    depends_on:
      - api
    restart: always

  api:
    build: ./node-express-server
    container_name: team-backend
    image: team-backend-image
    ports:
      - "4000:8080"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: 123456
      DB_NAME: testdb
    depends_on:
      - db
    restart: always

  db:
    image: mysql:8.0
    container_name: team-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: testdb
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./script.sql:/docker-entrypoint-initdb.d/script.sql

volumes:
  db_data:
